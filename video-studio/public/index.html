<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HyperFrames Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <span class="brand-text">HyperFrames</span>
      </div>
      
      <nav class="nav-menu">
        <button class="nav-item active" data-view="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </button>
        <button class="nav-item" data-view="projects">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          Projects
        </button>
        <button class="nav-item" data-view="renders">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Renders
        </button>
        <button class="nav-item" data-view="templates">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
          Templates
        </button>
      </nav>
      
      <div class="sidebar-bottom">
        <button class="btn btn-primary w-full" id="new-project-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Project
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <h1 class="page-title" id="current-view-title">Dashboard</h1>
        <div class="user-profile">
          <div class="avatar">HF</div>
        </div>
      </header>

      <div class="view-container" id="view-dashboard">
        <div class="stats-grid" id="stats-container">
          <!-- Stats will be populated here -->
        </div>
        
        <div class="dashboard-sections">
          <div class="section-card">
            <div class="section-header">
              <h2>Recent Projects</h2>
              <button class="btn btn-text btn-sm" onclick="app.switchView('projects')">View All</button>
            </div>
            <div class="list-container" id="recent-projects-list">
              <!-- Projects will be populated here -->
            </div>
          </div>
          
          <div class="section-card">
            <div class="section-header">
              <h2>Active Renders</h2>
              <button class="btn btn-text btn-sm" onclick="app.switchView('renders')">View All</button>
            </div>
            <div class="list-container" id="active-renders-list">
              <!-- Renders will be populated here -->
            </div>
          </div>
        </div>
      </div>

      <!-- Other views (Projects, Renders, Templates) -->
      <div class="view-container hidden" id="view-projects">
        <div class="grid-container" id="projects-grid"></div>
      </div>

      <div class="view-container hidden" id="view-renders">
        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>Render ID</th>
                <th>Project</th>
                <th>Format</th>
                <th>Quality</th>
                <th>Status</th>
                <th>Progress</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="renders-table-body"></tbody>
          </table>
        </div>
      </div>

      <div class="view-container hidden" id="view-templates">
        <div class="grid-container" id="templates-grid"></div>
      </div>
    </main>
  </div>

  <!-- Modals -->
  <div class="modal-overlay" id="modal-new-project">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Create New Project</h2>
        <button class="icon-btn close-modal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <form id="form-new-project">
        <div class="form-group">
          <label>Project Name</label>
          <input type="text" name="name" required placeholder="e.g., Summer Promo">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Format</label>
            <select name="format">
              <option value="horizontal">Horizontal (16:9)</option>
              <option value="vertical">Vertical (9:16)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Template</label>
            <select name="template_id" id="project-template-select">
              <option value="">Blank (Custom)</option>
              <!-- Populated dynamically -->
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Duration (s)</label>
            <input type="number" name="duration" value="10" step="0.1" min="1">
          </div>
          <div class="form-group">
            <label>FPS</label>
            <select name="fps">
              <option value="30">30 fps</option>
              <option value="60">60 fps</option>
              <option value="24">24 fps</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Project</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Render Modal -->
  <div class="modal-overlay" id="modal-render">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Start Render</h2>
        <button class="icon-btn close-modal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <form id="form-render">
        <input type="hidden" name="project_id" id="render-project-id">
        <div class="form-group">
          <label>Quality</label>
          <select name="quality">
            <option value="standard">Standard</option>
            <option value="high">High</option>
            <option value="draft">Draft</option>
          </select>
        </div>
        <div class="form-group">
          <label>Format</label>
          <select name="format">
            <option value="mp4">MP4 (H.264)</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Start Rendering</button>
        </div>
      </form>
    </div>
  </div>
  
  <!-- Video Player Modal -->
  <div class="modal-overlay" id="modal-video">
    <div class="modal-content video-modal">
      <div class="modal-header">
        <h2>Video Preview</h2>
        <button class="icon-btn close-modal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="video-container">
        <video id="preview-video" controls autoplay></video>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
